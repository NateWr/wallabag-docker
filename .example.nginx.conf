server {
        listen 443 ssl;
        server_name wallabag.notthisway.com;
        server_name_in_redirect off;

        location / {
                proxy_pass http://localhost:5002/;
                proxy_redirect off;
                proxy_set_header Host $host;
                proxy_set_header X-Forwarded-Proto https;
                proxy_set_header X-Forwarded-For $remote_addr;
        }

    ssl_certificate /etc/letsencrypt/live/wallabag.notthisway.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/wallabag.notthisway.com/privkey.pem; # managed by Certbot
}

server {
    if ($host = wallabag.notthisway.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name wallabag.notthisway.com;
    return 404; # managed by Certbot
}
